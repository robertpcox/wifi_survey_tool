<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survey Report Player</title>
  <link rel="stylesheet" href="../../shared/app-shell.css">
  <script type="module" src="./main.mjs"></script>
</head>
<body data-app="report-player">
  <header>
    <strong>Wi-Fi Survey v3</strong>
    <nav>
      <a href="../dashboard/">Dashboard</a>
      <a href="../creator/">Creator</a>
      <a href="../runner/">Runner</a>
    </nav>
  </header>
  <main>
    <p class="eyebrow">Report Player</p>
    <section class="shell-card">
      <h1>Analyze and replay one run</h1>
      <p>The merged report and playback shell is ready. Analysis arrives in Step 5.</p>
      <p data-shell-status>Starting Report Player shell…</p>
      <div class="map-access">
        <strong>Private map access</strong>
        <span>Decline access to continue with the public map and embedded overlays.</span>
        <div class="map-access-row">
          <input data-map-access type="password" autocomplete="off">
          <button class="primary" data-save-access>Use for this tab</button>
          <button data-clear-access>Continue public</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
